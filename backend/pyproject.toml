[project]
name = "xtractor-backend"
version = "1.0.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
line-length = 130
target-version = "py312"
exclude = ["venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "SIM105"]  # FastAPI Depends()/File() in defaults; explicit try/except is clearer here

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
